<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkLog プロジェクト</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{--blue:#5c82e6;--blue-d:#4a6fdc;--blue-soft:#eef2fd;--blue-line:#d5def7;--bg:#f7f9fc;--head:#1f2937;--text:#4b5563;--muted:#8a93a3;--line:#e3e8f2;--font:'Noto Sans JP','Source Han Sans JP','源ノ角ゴシック',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#111827;font-family:var(--font);color:var(--text)}
.s{position:absolute;left:50%;top:50%;width:1280px;height:720px;display:none;flex-direction:column;background:var(--bg);overflow:hidden}
.s.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:0}to{opacity:1}}
.hd{display:flex;justify-content:space-between;align-items:flex-end;padding:40px 72px 18px}
.eb{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.hd h1{margin:6px 0 0;font-size:40px;font-weight:900;color:var(--head);line-height:1.2}
.hd h1::after{content:"";display:block;width:56px;height:5px;border-radius:3px;background:var(--blue);margin-top:12px}
.meta{display:flex;align-items:center;gap:22px;color:var(--muted);font-size:15px;font-weight:500}
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--head);font-size:18px}
.logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;font-style:normal;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}
.lg{height:48px;width:auto;display:block}
.body{flex:1;padding:8px 72px 40px;display:flex;align-items:stretch;min-height:0}
.bar{position:absolute;left:0;bottom:0;width:100%;height:6px;background:linear-gradient(90deg,var(--blue-d),var(--blue),#9db4f0)}
.grid{display:grid;gap:12px;width:100%}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px 26px;box-shadow:0 2px 10px rgba(74,111,220,.06);display:flex;flex-direction:column}
.ic{width:52px;height:52px;border-radius:14px;background:var(--blue-soft);color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px;flex-shrink:0}
.card h3{margin:0 0 10px;font-size:23px;font-weight:700;color:var(--head)}
.card p{margin:0 0 14px;font-size:17px;line-height:1.75}
.card ul{list-style:none;margin:0 0 14px;padding:0;flex:1;display:flex;flex-direction:column}
.card li{flex:1;font-size:16px;padding:6px 0;display:flex;gap:10px;align-items:center;line-height:1.5;border-top:1px solid var(--line)}
.card li:first-child{border-top:2px solid var(--blue-line)}
.card li::before{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900;color:var(--blue);font-size:12px}
/* 修正: 見出しの下線とパディングを削除（li:first-child の線1本だけで区切る / 4ページと同じ構造） */
.col h3{display:flex;align-items:baseline;gap:8px;margin:0 0 14px}
.col h3 small{font-size:13px;font-weight:500;color:var(--muted)}
.tt{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px;letter-spacing:.06em}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg b{background:var(--blue-soft);color:var(--blue-d);border-radius:6px;padding:3px 10px;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;font-size:18px;border-radius:12px;padding:15px 0;transition:background .2s}
.btn:hover,.btn:focus-visible{background:var(--blue-d);outline:none}
.doc ul{color:var(--muted)}.doc li{font-size:17px}
/* agenda */
.ag{display:flex;align-items:center;gap:20px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 28px}
.ag b{width:52px;height:52px;border-radius:50%;background:var(--blue-soft);color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.ag h3{margin:0 0 3px;font-size:24px;color:var(--head)}.ag span{font-size:14px;color:var(--muted);font-weight:500}
.ag em{margin-left:auto;font-style:normal;font-size:15px;font-weight:700;color:var(--blue-d)}
/* cover / end */
.cover{flex-direction:row}
.cl{flex:1;padding:0 80px;display:flex;flex-direction:column;justify-content:center}
.tag{align-self:flex-start;background:var(--blue-soft);color:var(--blue-d);font-size:14px;font-weight:700;letter-spacing:.16em;padding:8px 16px;border-radius:999px;margin-bottom:26px}
.cl h1{margin:0;font-size:96px;font-weight:900;color:var(--head);letter-spacing:-.03em;line-height:1}
.cl h2{margin:20px 0 0;font-size:30px;font-weight:300}
.cl .ln{width:72px;height:6px;border-radius:3px;background:var(--blue);margin:34px 0 26px}
/* 修正: margin-left:-12px を削除（左の整列線に合わせる） */
.clogo{height:110px;align-self:flex-start;margin:0 0 18px}
.cr{width:440px;background:linear-gradient(160deg,var(--blue),var(--blue-d));display:flex;flex-direction:column;justify-content:center;gap:16px;padding:0 56px}
.chip{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:14px;padding:18px 22px;font-size:22px;font-weight:700}
.chip i{width:26px;text-align:center}
/* overview */
.ov{display:grid;grid-template-columns:1fr 1.3fr;gap:12px;width:100%}
.ovl{background:linear-gradient(160deg,var(--blue),var(--blue-d));border-radius:12px;padding:36px 38px;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.ovl small{font-size:14px;font-weight:700;letter-spacing:.16em;opacity:.85}
.ovl h2{margin:8px 0 14px;font-size:38px;font-weight:900}
.ovl p{margin:0 0 12px;font-size:19px;line-height:1.8}
.mods{display:flex;gap:8px;flex-wrap:wrap}
.mods span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700}
.ovr{display:grid;grid-template-rows:repeat(5,1fr);gap:8px}
.row{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 26px}
.row .ic{margin:0;width:48px;height:48px;font-size:20px}
.row h3{margin:0 0 3px;font-size:20px;color:var(--head)}.row p{margin:0;font-size:15px;line-height:1.55}
/* table */
.tb{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tb th{background:var(--blue-soft);color:var(--blue-d);font-size:16px;text-align:left;padding:14px 26px;height:1px}
.tb td{padding:10px 26px;border-top:1px solid var(--line);font-size:17px;line-height:1.55;vertical-align:middle}
.tb td:first-child{font-weight:700;color:var(--head);width:210px}.tb td:nth-child(2){width:310px}
.tb td b{display:inline-block;background:var(--blue-soft);color:var(--blue-d);border-radius:6px;padding:2px 9px;margin:2px 6px 2px 0;font-size:14px}
/* demo */
.dm{flex:1;display:flex;gap:20px;padding:0 72px 40px;min-height:0}
.dl{width:440px;flex-shrink:0;display:flex;flex-direction:column}
.dl h2{margin:0 0 12px;font-size:25px;font-weight:900;color:var(--head);line-height:1.45}
.dl ul{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column}
.dl li{flex:1;display:flex;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.dl li:first-child{border-top:2px solid var(--blue-line)}
.dl li::before{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900;color:#fff;background:var(--blue);width:24px;height:24px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dl li b{display:block;font-size:19px;color:var(--head);margin-bottom:3px}.dl li span{font-size:15px;line-height:1.55}
.dr{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.fr{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:0 10px 28px rgba(31,41,55,.16);flex-shrink:0}
.fr iframe{width:100%;height:100%;border:0}
.tc{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 22px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.tc p{margin:0;font-size:15px;line-height:1.6}
#pm{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:10px;align-items:center;background:rgba(17,24,39,.85);color:#e5e7eb;padding:6px 14px;border-radius:999px;font:13px var(--font);opacity:0;transition:opacity .3s}
body:hover #pm{opacity:1}
#pm button{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<div id="pm"><button id="pv">◀</button><span id="nm"></span><button id="nx">▶</button><button id="fs">全画面(F)</button></div>
<script>
/* ★ 기존 index.html의 var LOGO_SRC = "data:image/png;base64,...."; 한 줄을 아래 줄과 교체하세요. 비워두면 글자 로고가 표시됩니다. */
var LOGO_SRC = "";

var LOGO = LOGO_SRC ? '<img class="lg" src="'+LOGO_SRC+'" alt="WORKLOG ロゴ">' : '<span class="logo"><i>W</i>WorkLog</span>';
var out=[];
function head(eb,t,n){return '<div class="hd"><div><div class="eb">'+eb+'</div><h1>'+t+'</h1></div><div class="meta">'+LOGO+'<span>'+('0'+n).slice(-2)+' / __T__</span></div></div>'}
function slide(inner,cls,nobar){out.push('<section class="s '+(cls||'')+'">'+inner+(nobar?'':'<div class="bar"></div>')+'</section>')}

function tags(a){return a.map(function(x){return '<b>'+x+'</b>'}).join('')}

/* 1 表紙 */
slide('<div class="cl">'+LOGO.replace('class="lg"','class="lg clogo"')+'<span class="tag">Project Portfolio</span><h1>WorkLog</h1><h2>チームプロジェクト支援ウェブサイト</h2><div class="ln"></div><div class="tg">'+tags(['Java 17','Servlet','JSP','Oracle','jQuery','MVC (Command)'])+'</div></div><div class="cr">'+
 [['user','会員'],['id-card','マイページ'],['clipboard-list','掲示板'],['bookmark','ブックマーク']].map(function(c){return '<div class="chip"><i class="fa-solid fa-'+c[0]+'"></i>'+c[1]+'</div>'}).join('')+'</div>','cover');

/* 2 目次 */
var AG=[['プロジェクト概要・開発の目的','Overview','p.3'],['設計書','Design Documents','p.4'],['機能構成','Features','p.5'],['機能別の開発手法','Techniques','p.6'],['機能デモ（8本）','Demonstration','p.7–14'],['まとめ','Summary','p.15']];
slide(head('Agenda','目次',2)+'<div class="body"><div style="display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(3,1fr);gap:10px 12px;width:100%">'+
 AG.map(function(a,i){return '<div class="ag"><b>'+('0'+(i+1)).slice(-2)+'</b><div><h3>'+a[0]+'</h3><span>'+a[1]+'</span></div><em>'+a[2]+'</em></div>'}).join('')+'</div></div>');

/* 3 概要＋開発の目的 */
var GOALS=[['compass-drafting','設計を先に確定','要件分析・システム分析・DB設計を文書化してから、画面開発に入ります。'],
 ['folder-tree','プロジェクト単位の協業','投稿・未確認の投稿・ブックマークを、プロジェクトごとに管理します。'],
 ['puzzle-piece','4つの主要機能','会員・マイページ・掲示板・ブックマークで構成しています。'],
 ['layer-group','MVC・Commandパターン','View・Controller・Modelに役割を分け、保守と拡張がしやすい構造にします。'],
 ['shield-halved','権限とデータの整合性','本人のみ編集・削除、重複の防止など、ルールをDBとロジックの両方で守ります。']];
slide(head('Overview & Purpose','プロジェクト概要・開発の目的',3)+'<div class="body"><div class="ov"><div class="ovl"><div><small>ABOUT</small><h2>WorkLogとは？</h2><p>チームプロジェクトの進行をサポートするウェブサイトです。メンバー全員が同じ情報を見て動けることを目指しました。</p><p>機能を作る前に設計書で構造を固め、その設計どおりに開発する流れを実践することも目的です。</p></div><div class="mods"><span>会員</span><span>マイページ</span><span>掲示板</span><span>ブックマーク</span></div></div><div class="ovr">'+
 GOALS.map(function(c){return '<div class="row">'+ic(c[0])+'<div><h3>'+c[1]+'</h3><p>'+c[2]+'</p></div></div>'}).join('')+'</div></div></div>');

/* 4 設計書（ボタン → 新しいタブでPDF） */
var DOCS=[['clipboard-list','要件分析設計書','利用者の種類、機能要件、非機能要件を整理した文書です。',['利用者の種類','機能要件一覧','非機能要件'],'docs/requirements.pdf'],
 ['sitemap','システム分析設計書','アーキテクチャ、パッケージ構成、画面ごとの詳細を設計した文書です。',['Commandパターン MVC構成','画面別の詳細設計','Ajax機能の詳細'],'docs/system.pdf'],
 ['database','ERD（DB設計書）','テーブル定義、シーケンス、テーブル間の関係を示した文書です。',['テーブル定義','リレーション（1:N / N:M）','Oracleシーケンス'],'docs/erd.pdf']];
slide(head('Design Documents','設計書',4)+'<div class="body"><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+
 DOCS.map(function(d){return '<div class="card doc">'+ic(d[0])+'<h3>'+d[1]+'</h3><p>'+d[2]+'</p><ul>'+d[3].map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><a class="btn" href="'+d[4]+'" target="_blank" rel="noopener"><i class="fa-solid fa-file-pdf"></i>PDFを開く</a></div>'}).join('')+'</div></div>');

/* 5 機能構成（使用技術つき） */
var FEAT=[['会員','Member',['会員登録','ログイン','ログアウト'],['HttpSession','jQuery Ajax']],
 ['マイページ','My Page',['プロジェクト別の自分の投稿一覧','プロジェクト別の未確認投稿一覧'],['DAO / DTO','JSTL']],
 ['掲示板','Board',['プロジェクト別の投稿一覧','投稿作成・画像添付','編集・削除','投稿の確認・未確認一覧'],['Command','ファイルアップロード','ページング']],
 ['ブックマーク','Bookmark',['追加・解除','プロジェクト別一覧','一覧の編集'],['jQuery Ajax','複合主キー']]];
slide(head('Features','機能構成',5)+'<div class="body"><div class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr))">'+
 FEAT.map(function(c){return '<div class="card col"><h3>'+c[0]+'<small>'+c[1]+'</small></h3><ul>'+c[2].map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><div class="tt">使用技術</div><div class="tg">'+tags(c[3])+'</div></div>'}).join('')+'</div></div>');

/* 6 機能別の開発手法 */
var TECH=[['全体構造',['Commandパターン','FrontController'],'*.do のリクエストを1つのServletが受け、機能ごとのCommandに処理を委ね、結果をJSPへforwardします。'],
 ['ログイン・ログアウト',['HttpSession','JSTL c:if'],'ログイン時にセッションを生成し、ログアウト時にinvalidate()します。JSPでログイン状態により表示を切り替えます。'],
 ['非同期処理',['jQuery Ajax','POST'],'画面を再読み込みせず、必要な部分だけを更新します。'],
 ['データアクセス',['DAO / DTO','Oracleシーケンス'],'DAOがSQLを担当し、DTOでデータを受け渡します。番号はシーケンスで自動採番します。'],
 ['重複の防止',['複合主キー','中間テーブル'],'複合キーを持つ対応テーブルで、1人1回までを保証します。'],
 ['一覧表示',['ページング','検索'],'一覧をページ単位で取得し、検索条件で絞り込みます。']];
slide(head('Techniques','機能別の開発手法',6)+'<div class="body"><table class="tb"><tr><th>機能</th><th>使用した技術・手法</th><th>実装のポイント</th></tr>'+
 TECH.map(function(t){return '<tr><td>'+t[0]+'</td><td>'+tags(t[1])+'</td><td>'+t[2]+'</td></tr>'}).join('')+'</table></div>');

/* 7-14 機能デモ */
[['インデックス','lJqglDUfThY','WorkLogの入口となるトップページです。',[['サービス概要','WorkLogで何ができるかを、最初の画面で簡潔に紹介します。'],['ログイン・会員登録','未ログインの利用者を、会員登録とログインへ案内します。'],['主要機能へのアクセス','ダッシュボードや掲示板へ、ここから移動できます。']],['JSP','JSTL','CSS'],'ログイン状態に応じてメニュー表示を切り替えています。'],
['会員・マイページ','SGaf66l6S98','アカウント作成から、自分の投稿管理までの流れです。',[['会員登録','ユーザーが入力した会員情報を受け取り、入力内容の妥当性および重複の有無を確認する。パスワードをBCryptでハッシュ化した後、データベースに保存する。'],['ログイン・ログアウト','入力されたIDをもとに会員情報を取得し、BCryptを使用してパスワードを検証する。認証に成功すると、セッションにログイン情報を保存し、メイン画面へ遷移する。セッションを破棄し、安全に利用を終了します。'],['マイページ','自分の投稿と未確認投稿を、プロジェクト別に確認できます。']],['HttpSession','jQuery Ajax','DAO / DTO'],'ログイン情報はセッションで管理し、本人のデータだけを取得して表示します。'],
['ダッシュボード','oOcvzk2z0EM','参加中のプロジェクトの状況をひと目で把握できます。',[['状況の一覧','参加中プロジェクトの状態を、1画面にまとめて表示します。'],['最新の更新','新しい投稿や更新を、すぐ確認できます。'],['ショートカット','各機能へ最短で移動できるリンクを備えています。']],['JSP','JSTL','DAO'],'複数のデータを取得して1画面に集約し、必要な情報へすぐ辿り着けるようにしました。'],
['プロジェクト','UrXuaQqJrWE','チームの作業単位となるプロジェクトを管理します。',[['作成と確認','プロジェクトを作成し、内容を確認できます。'],['単位ごとの管理','投稿とブックマークを、プロジェクトに紐づけて管理します。'],['情報の共有','メンバー全員が同じ情報を見られます。']],['Commandパターン','DAO / DTO','Oracleシーケンス'],'プロジェクト番号をキーに、投稿やブックマークを関連付けています。'],

(function(){
 var S=[].slice.call(document.querySelectorAll('.s')),i=0;
 function fit(){var z=Math.min(innerWidth/1280,innerHeight/720);S.forEach(function(e){e.style.transform='translate(-50%,-50%) scale('+z+')'})}
 function show(n){i=Math.max(0,Math.min(S.length-1,n));S.forEach(function(e,j){e.classList.toggle('on',j===i)});document.getElementById('nm').textContent=(i+1)+' / '+S.length;try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
 function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
 document.addEventListener('keydown',function(e){var k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].indexOf(k)>-1){if(e.target.tagName==='A')return;e.preventDefault();show(i+1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].indexOf(k)>-1){e.preventDefault();show(i-1)}
  else if(k==='Home')show(0);else if(k==='End')show(S.length-1);else if(k==='f'||k==='F')fs()});
 document.getElementById('pv').onclick=function(){show(i-1)};
 document.getElementById('nx').onclick=function(){show(i+1)};
 document.getElementById('fs').onclick=fs;
 var x0;document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX});
 document.addEventListener('touchend',function(e){var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)show(d<0?i+1:i-1)});
 addEventListener('resize',fit);fit();
 show((parseInt(location.hash.slice(1))||1)-1);
})();
