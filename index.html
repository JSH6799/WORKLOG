<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkLog プロジェクト発表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
		<style>
			:root{
			  --blue:#5c82e6; --blue-d:#4a6fdc; --blue-soft:#eef2fd; --blue-line:#d5def7;
			  --bg:#f7f9fc; --card:#fff; --head:#1f2937; --text:#4b5563; --muted:#8a93a3; --line:#e3e8f2;
			  --font:'Noto Sans JP','Source Han Sans JP','源ノ角ゴシック',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
			}
			*{box-sizing:border-box}
			html,body{height:100%;margin:0;overflow:hidden;background:#111827;font-family:var(--font);color:var(--text)}
			.s{position:absolute;left:50%;top:50%;width:1280px;height:720px;display:none;flex-direction:column;background:var(--bg);transform-origin:center;overflow:hidden}
			.s.on{display:flex;animation:in .35s ease}
			@keyframes in{from{opacity:0}to{opacity:1}}
			
			/* header */
			.hd{display:flex;justify-content:space-between;align-items:flex-end;padding:44px 72px 22px}
			.eb{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
			.hd h1{margin:6px 0 0;font-size:42px;font-weight:900;color:var(--head);letter-spacing:-.01em;line-height:1.2}
			.hd h1::after{content:"";display:block;width:56px;height:5px;border-radius:3px;background:var(--blue);margin-top:14px}
			.meta{display:flex;align-items:center;gap:22px;color:var(--muted);font-size:15px;font-weight:500}
			.logo{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--head);font-size:18px}
			.logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;font-style:normal;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}
			.body{flex:1;padding:12px 72px 56px;display:flex;align-items:center}
			.bar{position:absolute;left:0;bottom:0;width:100%;height:6px;background:linear-gradient(90deg,var(--blue-d),var(--blue),#9db4f0)}
			
			/* cards */
			.grid{display:grid;gap:28px;width:100%}
			.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 32px;box-shadow:0 2px 10px rgba(74,111,220,.06)}
			.ic{width:56px;height:56px;border-radius:14px;background:var(--blue-soft);color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:18px}
			.card h3{margin:0 0 10px;font-size:24px;font-weight:700;color:var(--head)}
			.card p{margin:0;font-size:18px;line-height:1.8;color:var(--text)}
			.g6 .card{padding:24px 28px}.g6 .ic{width:48px;height:48px;font-size:20px;margin-bottom:14px}
			.g6 .card h3{font-size:22px}.g6 .card p{font-size:17px;line-height:1.7}
			
			/* features table-like */
			.col h3{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--blue-line);padding-bottom:14px;margin-bottom:16px}
			.col h3 small{font-size:13px;font-weight:500;color:var(--muted)}
			.col ul{list-style:none;margin:0;padding:0}
			.col li{font-size:17px;padding:7px 0;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
			.col li::before{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900;color:var(--blue);font-size:12px;margin-top:6px}
			
			/* agenda */
			.ag{display:flex;align-items:center;gap:20px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 24px}
			.ag b{width:48px;height:48px;border-radius:50%;background:var(--blue-soft);color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
			.ag h3{margin:0;font-size:22px;color:var(--head)}.ag span{font-size:13px;color:var(--muted);font-weight:500}
			
			/* video */
			.vid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:28px}
			.fr{width:768px;height:432px;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:0 12px 32px rgba(31,41,55,.18)}
			.fr iframe{width:100%;height:100%;border:0}
			.cap{margin-top:18px;font-size:16px;color:var(--muted)}.cap i{color:var(--blue);margin-right:8px}
			
			/* title / end */
			.cover{flex-direction:row;background:var(--bg)}
			.cl{flex:1;padding:0 80px;display:flex;flex-direction:column;justify-content:center}
			.tag{align-self:flex-start;background:var(--blue-soft);color:var(--blue-d);font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:8px 16px;border-radius:999px;margin-bottom:28px}
			.cl h1{margin:0;font-size:96px;font-weight:900;color:var(--head);letter-spacing:-.03em;line-height:1}
			.cl h2{margin:22px 0 0;font-size:30px;font-weight:300;color:var(--text)}
			.cl .ln{width:72px;height:6px;border-radius:3px;background:var(--blue);margin-top:36px}
			.cr{width:440px;background:linear-gradient(160deg,var(--blue),var(--blue-d));display:flex;flex-direction:column;justify-content:center;gap:16px;padding:0 56px}
			.chip{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:14px;padding:18px 22px;font-size:22px;font-weight:700}
			.chip i{width:26px;text-align:center}
			.end{background:linear-gradient(135deg,var(--blue-d),var(--blue));align-items:center;justify-content:center;text-align:center;color:#fff}
			.end .logo{color:#fff;font-size:28px;margin-bottom:34px}.end .logo i{background:#fff;color:var(--blue-d);width:48px;height:48px;font-size:26px;border-radius:12px}
			.end h1{margin:0 0 20px;font-size:64px;font-weight:900}
			.end p{margin:0;font-size:22px;opacity:.9}
			
			.lg{height:48px;width:auto;display:block}
			.lgw{height:150px;filter:brightness(0) invert(1);margin-bottom:28px}
			.clogo{height:120px;width:auto;align-self:flex-start;margin:0 0 20px -14px}
			.ov{display:grid;grid-template-columns:1fr 1.2fr;gap:32px;width:100%;height:430px}
			.ovl{background:linear-gradient(160deg,var(--blue),var(--blue-d));border-radius:20px;padding:44px 44px 40px;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
			.ovl small{font-size:14px;font-weight:700;letter-spacing:.16em;opacity:.85}
			.ovl h2{margin:10px 0 18px;font-size:42px;font-weight:900}
			.ovl p{margin:0;font-size:22px;line-height:1.8;font-weight:400}
			.mods{display:flex;gap:10px;flex-wrap:wrap}
			.mods span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 16px;font-size:16px;font-weight:700}
			.ovr{display:grid;grid-template-rows:repeat(3,1fr);gap:18px}
			.row{display:flex;align-items:center;gap:24px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 32px;box-shadow:0 2px 10px rgba(74,111,220,.06)}
			.row .ic{margin:0;flex-shrink:0}
			.row h3{margin:0 0 6px;font-size:22px;color:var(--head)}.row p{margin:0;font-size:17px;line-height:1.6}
			.dm{flex:1;display:flex;align-items:center;gap:40px;padding:0 72px 48px}
			.dl{width:392px;flex-shrink:0}
			.dl .n{font-size:14px;font-weight:700;letter-spacing:.14em;color:var(--blue)}
			.dl h2{margin:6px 0 14px;font-size:28px;font-weight:900;color:var(--head);line-height:1.4}
			.dl ul{list-style:none;margin:0;padding:0}
			.dl li{display:flex;gap:12px;align-items:flex-start;font-size:18px;line-height:1.55;padding:12px 0;border-top:1px solid var(--line)}
			.dl li:first-child{border-top:2px solid var(--blue-line)}
			.dl li::before{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900;color:#fff;background:var(--blue);width:22px;height:22px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px}
			.dm .fr{width:672px;height:378px;flex-shrink:0}
			.dm .cap{text-align:center}
			
			/* controls */
			#pm{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:10px;align-items:center;background:rgba(17,24,39,.85);color:#e5e7eb;padding:6px 14px;border-radius:999px;font:13px var(--font);opacity:0;transition:opacity .3s}
			body:hover #pm{opacity:1}
			#pm button{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:4px 10px;cursor:pointer}
		</style>
	</head>

		<body>
		
		<div id="app"></div>
		<div id="pm">
			<button id="pv">◀</button><span id="nm"></span>
			<button id="nx">▶</button><button id="fs">全画面(F)</button>
		</div>
